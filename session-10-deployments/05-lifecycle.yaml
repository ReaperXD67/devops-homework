apiVersion: v1
kind: Pod
metadata:
  name: life-running
  namespace: hw10
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: life-succeeded
  namespace: hw10
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - echo success; exit 0
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: life-failed
  namespace: hw10
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - echo intentional-failure; exit 1
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: life-pending
  namespace: hw10
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
  nodeSelector:
    homework/nonexistent: 'true'
