apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable
  namespace: hw10
spec:
  replicas: 4
  selector:
    matchLabels: &id001
      app: canary-demo
      track: stable
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        command:
        - sh
        - -c
        args:
        - printf "%s\n" "$VERSION" > /usr/share/nginx/html/index.html; exec nginx
          -g "daemon off;"
        env:
        - name: VERSION
          value: stable-v1
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: hw10
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: canary-demo
      track: canary
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        command:
        - sh
        - -c
        args:
        - printf "%s\n" "$VERSION" > /usr/share/nginx/html/index.html; exec nginx
          -g "daemon off;"
        env:
        - name: VERSION
          value: canary-v2
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: canary-demo
  namespace: hw10
spec:
  type: ClusterIP
  selector:
    app: canary-demo
  ports:
  - name: http
    port: 80
    targetPort: 80
