apiVersion: v1
kind: Namespace
metadata:
  name: hw11
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hw11
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: web
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        command:
        - sh
        - -c
        args:
        - printf "%s\n" "$VERSION" > /usr/share/nginx/html/index.html; exec nginx
          -g "daemon off;"
        env:
        - name: VERSION
          value: Hello from Kubernetes Services
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clusterip
  namespace: hw11
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport
  namespace: hw11
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer
  namespace: hw11
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: headless
  namespace: hw11
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: 80
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: externalname
  namespace: hw11
spec:
  type: ExternalName
  externalName: example.com
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  namespace: hw11
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 86400
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
