apiVersion: v1
kind: Namespace
metadata:
  name: hw14
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hw14
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: web
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        command:
        - sh
        - -c
        args:
        - printf "%s\n" "$VERSION" > /usr/share/nginx/html/index.html; exec nginx
          -g "daemon off;"
        env:
        - name: VERSION
          value: v1
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hw14
spec:
  type: ClusterIP
  selector:
    app: typo
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: crash
  namespace: hw14
spec:
  restartPolicy: Always
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - echo "required configuration missing"; exit 1
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
  namespace: hw14
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: nginx:homework-tag-does-not-exist
    command:
    - sh
    - -c
    - sleep 86400
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: pending
  namespace: hw14
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 86400
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
  nodeSelector:
    homework/missing-node: 'true'
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-volume
  namespace: hw14
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 86400
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
    volumeMounts:
    - name: config
      mountPath: /config
  volumes:
  - name: config
    configMap:
      name: missing-config
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-config
  namespace: hw14
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 86400
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
    env:
    - name: APP_ENV
      valueFrom:
        configMapKeyRef:
          name: missing-config
          key: APP_ENV
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-dns
  namespace: hw14
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 86400
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
  dnsPolicy: None
  dnsConfig:
    nameservers:
    - 203.0.113.53
