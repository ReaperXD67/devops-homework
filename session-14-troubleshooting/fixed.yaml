apiVersion: v1
kind: Pod
metadata:
  name: crash
  namespace: hw14
spec:
  restartPolicy: Always
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - echo recovered; sleep 86400
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
---
