groups:
  - name: application
    rules:
      - alert: ApplicationDown
        expr: up{job="devops-app"} == 0
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: DevOps application is unavailable
      - alert: HighApplicationMemory
        expr: process_resident_memory_bytes{job="devops-app"} > 100 * 1024 * 1024
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Application RSS exceeds 100 MiB
