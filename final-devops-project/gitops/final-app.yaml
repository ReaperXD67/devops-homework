apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: final-application
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  path: ./final-devops-project/kubernetes
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: devops-homework
