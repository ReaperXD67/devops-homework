name: DevOps CI and security-gated CD
on:
  push:
    branches: [main]
    paths:
      - final-devops-project/application/**
      - final-devops-project/docker/**
      - final-devops-project/kubernetes/**
      - final-devops-project/security/**
      - .github/workflows/devsecops.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: devops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/reaperxd67/devops-homework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and unit test
        run: |
          mkdir -p reports
          cd final-devops-project/application
          npm ci --ignore-scripts
          npm run build
          npm test | tee ../../reports/unit-tests.txt
      - name: SAST security gate
        run: |
          python -m pip install semgrep
          semgrep scan --error --config p/javascript --config final-devops-project/security/semgrep.yaml --json --output reports/sast.json final-devops-project/application
      - name: SCA security gate
        run: |
          cd final-devops-project/application
          npm audit --audit-level=high --json > ../../reports/sca.json
      - name: Secret scanning security gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          format: json
          output: reports/secrets.json
      - name: Build container
        run: docker build -f final-devops-project/docker/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" final-devops-project
      - name: Container image security gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/reaperxd67/devops-homework:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: reports/image-scan.json
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image after security gates
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: devops-ci
          wait: 120s
      - name: Deploy and verify in Kubernetes
        run: |
          kind load docker-image "$IMAGE:${{ github.sha }}" --name devops-ci
          kubectl apply -f final-devops-project/kubernetes/namespace.yaml
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          kubectl -n devops-final create secret generic app-secret --from-literal=token="$TOKEN"
          kubectl apply -k final-devops-project/kubernetes
          kubectl -n devops-final set image deployment/devops-app app="$IMAGE:${{ github.sha }}"
          kubectl -n devops-final rollout status deployment/devops-app --timeout=120s
          kubectl -n devops-final get pods,svc,hpa -o wide | tee reports/kubernetes.txt
          kubectl -n devops-final port-forward svc/devops-app 18080:80 > reports/port-forward.txt 2>&1 &
          healthy=false
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:18080/healthz; then healthy=true; break; fi
            sleep 2
          done
          test "$healthy" = true
          curl --fail http://127.0.0.1:18080/api/info | tee reports/deployed-api.json
          curl --fail http://127.0.0.1:18080/metrics | tee reports/deployed-metrics.txt
          kubectl -n devops-final logs deployment/devops-app --tail=20 | tee reports/application-logs.txt
      - name: Upload execution and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devops-evidence-${{ github.run_number }}
          path: reports/
          retention-days: 30
