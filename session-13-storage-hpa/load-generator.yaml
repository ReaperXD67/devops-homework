apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: hw13
spec:
  restartPolicy: Never
  containers:
  - name: demo
    image: busybox:1.37
    command:
    - sh
    - -c
    - while true; do wget -q -O- http://php-apache >/dev/null; done
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
  activeDeadlineSeconds: 360
